<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flat colour control</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{padding:28px;background:#f4f1e8;color:#17191d}.header{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.header h1{margin:0;font-size:34px}.header p{margin:0;font-size:14px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.swatch{height:70px;border:1px solid #20242b}.red{background:#f00}.yellow{background:#ff0}.green{background:#0f0}.cyan{background:#0ff}.blue{background:#00f}.magenta{background:#f0f}.dark-1{background:#111}.dark-2{background:#14213d}.dark-3{background:#173f35}.dark-4{background:#3b163f}.dark-5{background:#4a2017}.dark-6{background:#20252b}.pastel-1{background:#ffd7df}.pastel-2{background:#fff0b8}.pastel-3{background:#ccefd7}.pastel-4{background:#cbe9ff}.pastel-5{background:#dcd5ff}.pastel-6{background:#f0d2f1}.brand-1{background:#ef476f}.brand-2{background:#f6bd60}.brand-3{background:#06d6a0}.brand-4{background:#118ab2}.brand-5{background:#5f4bb6}.brand-6{background:#c44536}.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:18px}.tone{height:58px;border:1px solid #59606a}.g0{background:#fff}.g1{background:#e3e3e3}.g2{background:#c6c6c6}.g3{background:#aaa}.g4{background:#8e8e8e}.g5{background:#717171}.g6{background:#555}.g7{background:#393939}.g8{background:#1c1c1c}.g9{background:#000}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.borders,.vectors{height:185px;background:#fff;padding:20px}.hairline{border:1px solid #e63946;padding:12px;margin-bottom:18px}.solid{border:4px solid #2a9d8f;padding:12px}.vectors{display:flex;align-items:center;justify-content:space-around}
</style>
</head>
<body>
<div class="header"><h1>Flat colour control</h1><p>RGB · grey · solid vector paint</p></div>
<section class="swatches">
<div class="swatch red"></div><div class="swatch yellow"></div><div class="swatch green"></div><div class="swatch cyan"></div><div class="swatch blue"></div><div class="swatch magenta"></div>
<div class="swatch dark-1"></div><div class="swatch dark-2"></div><div class="swatch dark-3"></div><div class="swatch dark-4"></div><div class="swatch dark-5"></div><div class="swatch dark-6"></div>
<div class="swatch pastel-1"></div><div class="swatch pastel-2"></div><div class="swatch pastel-3"></div><div class="swatch pastel-4"></div><div class="swatch pastel-5"></div><div class="swatch pastel-6"></div>
<div class="swatch brand-1"></div><div class="swatch brand-2"></div><div class="swatch brand-3"></div><div class="swatch brand-4"></div><div class="swatch brand-5"></div><div class="swatch brand-6"></div>
</section>
<section class="ramp"><div class="tone g0"></div><div class="tone g1"></div><div class="tone g2"></div><div class="tone g3"></div><div class="tone g4"></div><div class="tone g5"></div><div class="tone g6"></div><div class="tone g7"></div><div class="tone g8"></div><div class="tone g9"></div></section>
<section class="details"><div class="borders"><div class="hairline">1 px border</div><div class="solid">4 px border</div></div><div class="vectors"><svg width="150" height="130" viewBox="0 0 150 130"><title>Solid circle and check</title><circle cx="66" cy="64" r="52" fill="#ff6b35" stroke="#12355b" stroke-width="4"/><path d="M38 71L61 94L105 40" fill="none" stroke="#fff" stroke-width="9"/></svg><svg width="160" height="130" viewBox="0 0 160 130"><title>Solid landscape shapes</title><rect x="12" y="15" width="136" height="100" rx="18" fill="#4ecdc4" stroke="#5f4bb6" stroke-width="1"/><path d="M30 92L58 54L82 78L108 37L134 92Z" fill="#14213d" stroke="#f6bd60" stroke-width="4"/></svg></div></section>
</body>
</html>
