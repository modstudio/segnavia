<!doctype html>
<html lang="en"><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}body{padding:60px;background:linear-gradient(145deg,#edf2ff,#fff3e7);color:#17213c}h1{font-size:48px;margin:0 0 36px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.card{height:330px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 3px 4px #26345b24,0 18px 38px #26345b2e,inset 0 0 0 1px #fff9}.card:nth-child(2){transform:translateY(-12px);box-shadow:0 6px 8px #26345b24,0 34px 52px #26345b3d,inset 0 0 0 1px #fff}.art{height:175px;background:linear-gradient(135deg,#ff6c88,#ffca67 47%,#6967ec);position:relative}.art::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;inset:20px auto auto 70px;background:#fff5;box-shadow:inset 0 0 35px #fff}.text{padding:24px}.text b{font-size:24px}.text p{color:#566079;line-height:1.4}.dark{color:#f5f6ff;background:#171b31;box-shadow:0 3px 5px #05071388,0 24px 50px #12152b99,inset 0 0 0 1px #ffffff24}.dark .art{background:linear-gradient(135deg,#2238a8,#a24fe7 55%,#ff5c8a)}.dark .text p{color:#bfc4db}.wide{grid-column:span 2;height:245px}.wide .art{height:100%;width:45%;float:left}.wide .text{margin-left:45%;padding:36px}
</style><body><h1>Spaces worth saving</h1><main class="grid">
<article class="card" data-fidelity="light-layers"><div class="art"></div><div class="text"><b>Quiet geometry</b><p>Soft color, crisp edges, and room to breathe.</p></div></article>
<article class="card" data-fidelity="elevated"><div class="art"></div><div class="text"><b>High summer</b><p>A hover-state card held at full elevation.</p></div></article>
<article class="card dark" data-fidelity="dark-layers"><div class="art"></div><div class="text"><b>After hours</b><p>Layered shadows on a dark surface.</p></div></article>
<article class="card wide" data-fidelity="rounded-image"><div class="art"></div><div class="text"><b>One collection, many moods</b><p>Gradient artwork is clipped by the card's rounded shell.</p></div></article>
</main></body></html>
