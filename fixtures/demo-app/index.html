<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classroom (demo app)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1c1c1c; background: #f6f6f4; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 28px; background: #fff; border-bottom: 1px solid #ddd; }
  header h1 { font-size: 20px; margin: 0; }
  .profile { margin-inline-start: auto; padding: 4px 12px; border-radius: 999px; background: #e8e3ff; }
  main { padding: 28px; max-width: 960px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eee; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #2b59c3; background: #2b59c3; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #2b59c3; }
  dialog { border: 1px solid #ccc; border-radius: 10px; padding: 24px; width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.25); }
  label { display: block; margin: 12px 0 4px; }
  input, select { font: inherit; width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  body.compact main { padding: 8px; max-width: 640px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  #late-screen, #target-test { display: none; }
  body.late main > :not(#late-screen), body.targets main > :not(#target-test) { display: none; }
  body.late #late-screen, body.targets #target-test { display: block; }
</style>
</head>
<body>
<header><h1>Classroom</h1><nav>Classes · Students · Reports</nav><span class="session-only">Teacher tools</span><span class="profile">Signed in as A. Teacher</span></header>
<main>
  <aside class="toast">Saved</aside>
  <div class="toolbar"><h2>Your classes</h2><button type="button" id="new">New class</button></div>
  <table><thead><tr><th>Class</th><th>Grade</th><th>Students</th></tr></thead>
    <tbody><tr><td>Morning reading</td><td>2</td><td>18</td></tr><tr><td>Number sense</td><td>3</td><td>22</td></tr></tbody></table>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <form method="dialog">
    <h3 id="dialog-title">New class</h3>
    <label for="name">Class name</label><input id="name" name="name">
    <label for="grade">Grade</label><select id="grade"><option>1</option><option selected>2</option><option>3</option></select>
    <div class="actions"><button type="submit" class="secondary" value="cancel">Cancel</button><button type="submit" value="create">Create</button></div>
  </form>
</dialog>
<section id="late-screen"><div id="late-image"></div><button type="button" id="late-target">Image loaded</button></section>
<section id="target-test"><button type="button" class="duplicate">Same target</button><button type="button" class="duplicate">Same target</button><button type="button" id="outside" style="position:absolute;top:2000px">Outside</button></section>
<script>
  document.getElementById('new').addEventListener('click', () => document.getElementById('dialog').showModal())
  // A stored preference the capture flows set before a shot.
  if (localStorage.getItem('layout') === 'compact') document.body.classList.add('compact')
  // A screen whose data comes from an API that may refuse under load.
  if (location.pathname === '/busy') fetch('/api/busy')
  if (location.pathname === '/late' || location.pathname === '/settling') {
    document.body.classList.add('late')
    setTimeout(() => { document.getElementById('late-image').innerHTML = '<img alt="Late" width="240" height="180" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22180%22%3E%3Crect width=%22240%22 height=%22180%22 fill=%22green%22/%3E%3C/svg%3E">' }, location.pathname === '/late' ? 3000 : 700)
  }
  if (location.pathname === '/targets') document.body.classList.add('targets')
</script>
</body>
</html>
