# Names from the PDF, ICC and OpenType specifications, spelled as the specifications spell them.
[default.extend-words]
# FlateDecode, the PDF compression filter.
flate = "flate"
# DecodeParms, the PDF filter-parameters key.
parms = "parms"
# The Paeth predictor of the PNG filters PDF images use.
paeth = "paeth"
# The ICC mBA tag type, read as "m" and "BA".
ba = "ba"
# The OpenType width variation axis tag, as it appears in embedded font names.
wdth = "wdth"
