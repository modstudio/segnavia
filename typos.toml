# Generated TeX hyphenation patterns: word fragments, not words.
[files]
extend-exclude = ["packages/layout/src/hyphenation-en-us.ts"]

# Short commit hashes Changesets writes into each CHANGELOG.
[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7}\\b",
  # The header key "% licence:" of a hyph-utf8 pattern file, spelled as that source spells it.
  "% licence:",
]

# Names from the PDF, ICC and OpenType specifications, spelled as the specifications spell them.
[default.extend-words]
# FlateDecode, the PDF compression filter.
flate = "flate"
# DecodeParms, the PDF filter-parameters key.
parms = "parms"
# The Paeth predictor of the PNG filters PDF images use.
paeth = "paeth"
# The ICC mBA tag type, read as "m" and "BA".
ba = "ba"
# The OpenType width variation axis tag, as it appears in embedded font names.
wdth = "wdth"
# The case-insensitive sticky RegExp flags, in the order Biome writes them.
iy = "iy"
